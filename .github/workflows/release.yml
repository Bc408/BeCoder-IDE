name: Release BeCoder Setup

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix, for example 1.1.0'
        required: true
        type: string
      commit:
        description: 'Full main commit SHA to build and publish'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_COMMIT: ${{ inputs.commit }}
  RELEASE_TAG: v${{ inputs.version }}

jobs:
  build:
    name: Build Windows x64 Setup
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VSCODE_ARCH: x64
      npm_config_arch: x64
      npm_config_foreground_scripts: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use X.Y.Z without a prefix: $RELEASE_VERSION"
            exit 1
          fi
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release commit must be a full lowercase commit SHA: $RELEASE_COMMIT"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_sha" = "$RELEASE_COMMIT"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 1
          fi
      - name: Locate Visual Studio C++ toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsPath)) { throw 'No Visual Studio C++ toolchain was found.' }
          "vs2022_install=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = 'Stop'
          exec { npm ci }
          $nativeBindings = @(
            'node_modules\@vscode\policy-watcher\build\Release\vscode-policy-watcher.node',
            'node_modules\@vscode\spdlog\build\Release\spdlog.node',
            'node_modules\@vscode\sqlite3\build\Release\vscode-sqlite3.node',
            'node_modules\native-keymap\build\Release\keymapping.node',
            'node_modules\windows-foreground-love\build\Release\foreground_love.node'
          )
          if ($nativeBindings.Where({ -not (Test-Path -LiteralPath $_ -PathType Leaf) }).Count -gt 0) {
            exec { npm rebuild '@vscode/policy-watcher' '@vscode/spdlog' '@vscode/sqlite3' 'native-keymap' --foreground-scripts }
            exec { npx --yes node-gyp rebuild --directory node_modules/windows-foreground-love --target=42.6.0 --dist-url=https://electronjs.org/headers --runtime=electron --arch=x64 }
          }
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate and build
        shell: pwsh
        run: |
          npm run typecheck-client
          npm run compile-oi-extensions
          npm run valid-layers-check
          npm run gulp vscode-win32-x64-min
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build and verify Setup
        shell: pwsh
        run: |
          $packageRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'VSCode-win32-x64'
          & .\build\azure-pipelines\win32\verify-becoder-package.ps1 -PackagePath $packageRoot -IncludeCompiler $true
          npm run gulp -- vscode-win32-x64-becoder-setup
          $setup = ".build\win32-x64\becoder-setup\BeCoderSetup-x64-$env:RELEASE_VERSION.exe"
          & .\build\azure-pipelines\win32\verify-becoder-setup.ps1 -SetupPath $setup -StagedPackagePath $packageRoot
      - uses: actions/upload-artifact@v7
        with:
          name: BeCoderSetup-x64
          path: .build/win32-x64/becoder-setup/BeCoderSetup-x64-${{ inputs.version }}.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: BeCoderSetup-x64
          path: release
      - name: Publish Setup-only release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_sha" = "$RELEASE_COMMIT"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 1
          fi
          setup="release/BeCoderSetup-x64-$RELEASE_VERSION.exe"
          test -f "$setup"
          gh release create "$RELEASE_TAG" "$setup" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "BeCoder $RELEASE_TAG" \
            --generate-notes
